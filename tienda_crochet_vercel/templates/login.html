{% extends "base.html" %}
{% block titulo %}Iniciar sesión - La Tienda del Crochet{% endblock %}

{% block content %}

<div class="contenedor-formulario">
    <h1>Iniciar sesión ♡</h1>

    {% if error %}
        <div class="mensaje-error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST" onsubmit="return validarLogin()">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Entrar</button>
    </form>

    <div class="enlace-secundario">
        ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a>
    </div>

    <p style="text-align:center; font-size: 0.75em; color: var(--marron-suave); margin-top: 20px;">
        Acceso admin de prueba: admin@crochet.com / admin123
    </p>
</div>

{% endblock %}
