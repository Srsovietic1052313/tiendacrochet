{% extends "base.html" %}
{% block titulo %}Mi perfil - La Tienda del Crochet{% endblock %}

{% block content %}

<div class="layout-panel">
    <aside class="panel-lateral">
        <h3>Mi cuenta</h3>
        <a href="{{ url_for('cliente_pedidos') }}">Mis pedidos</a>
        <a href="{{ url_for('cliente_perfil') }}" class="activo">Mi perfil</a>
        <a href="{{ url_for('logout') }}">Cerrar sesión</a>
    </aside>

    <div class="panel-contenido">
        <h1>Mi perfil</h1>

        <form action="{{ url_for('cliente_perfil') }}" method="POST" style="max-width: 420px;">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>

            <label for="email_actual">Correo</label>
            <input type="email" id="email_actual" value="{{ usuario.email }}" disabled>

            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" name="telefono" value="{{ usuario.telefono or '' }}">

            <label for="direccion">Dirección de envío</label>
            <input type="text" id="direccion" name="direccion" value="{{ usuario.direccion or '' }}">

            <button type="submit" class="btn" style="margin-top: 20px;">Guardar cambios</button>
        </form>
    </div>
</div>

{% endblock %}
