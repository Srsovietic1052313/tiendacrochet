{% extends "base.html" %}
{% block titulo %}Crear cuenta - La Tienda del Crochet{% endblock %}

{% block content %}

<div class="contenedor-formulario">
    <h1>Crear cuenta ♡</h1>

    {% if error %}
        <div class="mensaje-error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('registro') }}" method="POST" onsubmit="return validarRegistro()">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Registrarme</button>
    </form>

    <div class="enlace-secundario">
        ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
    </div>
</div>

{% endblock %}
